[project]
name = "biosai"
version = "0.1.0"
description = "BIOS emulator + AI tuning tutor: extract UEFI setup menus from firmware images and teach users how to tune them"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "anthropic>=2.4.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
biosai = "biosai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biosai"]
